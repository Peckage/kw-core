# Docker Compose for Kwik Development Services
# Redis for metadata + MinIO for S3-compatible storage (both free/OSS)

services:
  redis:
    image: redis:7-alpine
    container_name: kwik-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: kwik-minio
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Creates the bucket on startup
  minio-init:
    image: minio/mc:latest
    container_name: kwik-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/kwik-files --ignore-existing;
      mc anonymous set download local/kwik-files;
      echo 'Bucket created successfully';
      exit 0;
      "

volumes:
  redis_data:
  minio_data:
