# ═══════════════════════════════════════════════════════════════════════════
# Kwik Production Docker Compose
# ═══════════════════════════════════════════════════════════════════════════
#
# This runs the supporting services (Redis + MinIO) on the production VPS.
# The Next.js app runs via systemd, NOT in Docker.
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# Data is persisted in named volumes.
# Services restart automatically on reboot.
#
# ═══════════════════════════════════════════════════════════════════════════

services:
  # ─────────────────────────────────────────────────────────────
  # Redis - Metadata storage and stats
  # ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: kwik-redis
    ports:
      - "127.0.0.1:6379:6379" # Bind to localhost only (security)
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─────────────────────────────────────────────────────────────
  # MinIO - S3-compatible object storage
  # ─────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: kwik-minio
    # S3 API bound to localhost only - NOT exposed to public internet
    # Admin console disabled in production (no --console-address flag)
    ports:
      - "127.0.0.1:9000:9000" # S3 API (localhost only for Next.js app)
    environment:
      # REQUIRED: Set these in .env file - no defaults for security
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data
    command: server /data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─────────────────────────────────────────────────────────────
  # MinIO Init - Creates bucket on first startup
  # ─────────────────────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: kwik-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb local/kwik-files --ignore-existing;
      echo 'Bucket kwik-files ready';
      exit 0;
      "
    restart: "no"

volumes:
  redis_data:
    name: kwik-redis-data
  minio_data:
    name: kwik-minio-data
